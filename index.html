<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUJAAIC</title>
    <style>
        :root {
            --accent: black;
            --bg-grey: #1e1e1e;
        }

        body {
            margin: 0;
            background: WHITE;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            scroll-behavior: smooth;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(7px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-name {
            font-weight: 800;
            letter-spacing: 0.2rem;
            font-size: clamp(1.2rem, 5vw, 2.5rem);
            color: white;
            text-align: center;
            flex-grow: 1;
            animation: blurIn 1s ease-out forwards;
        }

        @keyframes blurIn {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.9); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        .menu-btn {
            font-size: 2rem;
            cursor: pointer;
            color: var(--accent);
            user-select: none;
        }

        /* Sliding Side Nav */
        .side-nav {
            height: 100vh;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            right: 0;
            background-color: var(--bg-grey);
            overflow-x: hidden;
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            padding-top: 2rem;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .side-nav.open { 
            width: 280px; 
        }

        .side-nav a {
            padding: 1rem 2rem;
            text-decoration: none;
            font-size: 1.2rem;
            color: white;
            transition: 0.3s;
            cursor: pointer;
        }

        .side-nav a:hover { 
            color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        .close-btn {
            font-size: 2.5rem;
            text-align: right;
            padding-right: 1.5rem;
            color: white;
            cursor: pointer;
            line-height: 1;
        }

        /* Account for fixed header offset during smooth scroll */
        section {
            scroll-margin-top: 5rem;
            padding: 4rem 2rem;
            min-height: 50vh;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- Fixed Header Navigation -->
    <div id="h">
        <nav class="header">
            <img src="symbol.webp" style="height: 3.5rem; width: 3.5rem;" alt="logo">
            <div class="brand-name">YUJAAIC</div>
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
        </nav>
    </div>

    <!-- Side Menu Drawer -->
    <div id="side-menu" class="side-nav">
        <span class="close-btn" onclick="toggleMenu()">&times;</span>
        <a onclick="scrollToDiv('h')">Home</a>
        <a onclick="scrollToDiv('hero1')">About</a>
        <a onclick="scrollToDiv('b1')">Services</a>
        <a onclick="scrollToDiv('partners')">Service Partners</a>
        <a href="bot.html">ChatBot</a>
        <a onclick="scrollToDiv('work')">Projects</a>
        <a onclick="scrollToDiv('more')">Motto</a>
        <a onclick="scrollToDiv('contact')">Contact</a>
        <a onclick="scrollToDiv('FAQs')">FAQs</a>
    </div>

    <!-- Target Sections (Placeholders) -->
    <section id="hero1"><h2>About</h2></section>
    <section id="b1"><h2>Services</h2></section>
    <section id="partners"><h2>Service Partners</h2></section>
    <section id="work"><h2>Projects</h2></section>
    <section id="more"><h2>Motto</h2></section>
    <section id="contact"><h2>Contact</h2></section>
    <section id="FAQs"><h2>FAQs</h2></section>

    <script>
        function toggleMenu() {
            document.getElementById("side-menu").classList.toggle("open");
        }

        function scrollToDiv(id) {
            const target = document.getElementById(id);
            if (target) {
                target.scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'start'
                });
                // Auto-close navigation drawer after link click
                document.getElementById("side-menu").classList.remove("open");
            }
        }
    </script>
</body>
</html>
